version: 2

multi-ecosystem-groups:
  actions-updates:
    schedule:
      interval: "daily"
    commit-message:
      prefix: "chore"
    labels:
      - "dependencies"
  nix-updates:
    schedule:
      interval: "daily"
    commit-message:
      prefix: "chore"
    labels:
      - "dependencies"

updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 2
    commit-message:
      prefix: "chore"
    labels:
      - "dependencies"
    open-pull-requests-limit: 10
    groups:
      dependency-updates:
        patterns:
          - "*"
    ignore:
      # Dependabot's Bun updater currently misidentifies the catalog override
      # as the npm vite package and proposes an unrelated major update.
      - dependency-name: "vite"
      # Bun resolves these RC packages without changing the dependency files,
      # which causes Dependabot's update job to fail with NoChangeError.
      - dependency-name: "drizzle-orm"
      - dependency-name: "drizzle-kit"

  - package-ecosystem: "github-actions"
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: "actions-updates"
    schedule:
      interval: "daily"

  - package-ecosystem: "nix"
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: "nix-updates"
    schedule:
      interval: "daily"
