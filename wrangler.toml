"$schema" = "node_modules/wrangler/config-schema.json"
name = "record"
main = "apps/server/src/index.ts"
compatibility_date = "2026-03-30"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "apps/client/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[observability]
enabled = true

[observability.traces]
enabled = true

[[ratelimits]]
name = "ACCOUNT_MUTATION_RATE_LIMIT"
namespace_id = "10001"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "ACTIVITY_MUTATION_RATE_LIMIT"
namespace_id = "10002"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "BULK_DELETE_RATE_LIMIT"
namespace_id = "10003"
simple = { limit = 5, period = 60 }
